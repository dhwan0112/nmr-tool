[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nmr-tool"
version = "0.2.0"
description = "Read processed Bruker 1H NMR spectra and reproduce the CM3191 Expt 4 (linalool) analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
nmrtools = "nmrtools.cli:main"

[tool.setuptools]
packages = ["nmrtools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
