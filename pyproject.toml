[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nmr-tool"
version = "0.4.0"
description = "Read and analyse processed Bruker 1H NMR spectra from an interactive shell"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
nmrtools = "nmrtools.cli:main"

[tool.setuptools]
packages = ["nmrtools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
